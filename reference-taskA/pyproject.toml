[project]
name = "aptams"
version = "0.0.0"
description = "Adolescent physical fitness assessment and monitoring system — glass-box fitness agent with verified explanations."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary — Shenzhen University summer camp project" }
authors = [{ name = "APTAMS team, School of Artificial Intelligence, Shenzhen University" }]

# Kept minimal on purpose. The T0 core (rule engine, counterfactual search,
# synthetic cohorts) is deliberately dependency-light and ML-free. Heavier
# layers (attribution, agent) declare their own deps as optional extras so a
# missing one never blocks the ground-truth core.
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Attribution layer (§5.2) — GBM + SHAP. Only needed once T1 data exists.
attribution = ["numpy>=1.26", "scikit-learn>=1.4", "shap>=0.45"]
# Task A analysis (analysis/). Kept out of the core so the ML-free rule engine
# stays installable on its own — the ground-truth path must never depend on these.
analysis = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "shap>=0.45",
    "lime>=0.2",
    "matplotlib>=3.8",
    "pdfplumber>=0.11",
    "openpyxl>=3.1",
    "python-docx>=1.1",
    "pyarrow>=15.0",
    "tabulate>=0.9",
]
# Dev tooling.
dev = ["pytest>=8.0", "ruff>=0.4", "mypy>=1.9", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["aptams*", "analysis*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom puts these calls in argument defaults on purpose.
# Whitelisting them keeps B008 meaningful for genuinely accidental call-in-default bugs.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Header",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
